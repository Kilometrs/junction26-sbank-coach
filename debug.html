<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach debug</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; max-width: 900px; margin: 16px auto; padding: 0 16px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }
  pre { background: #f3f3f3; padding: 8px; overflow: auto; white-space: pre-wrap; margin: 4px 0; font-size: 12px; }
  #log { border: 1px solid #ccc; height: 420px; overflow: auto; padding: 8px; }
  .user { color: #06c; } .coach { color: #000; } .card { color: #777; font-size: 12px; }
  form { display: flex; gap: 8px; margin-top: 8px; } input { flex: 1; padding: 6px; }
  select, button { padding: 6px; }
</style>
<h3>Coach debug page (not the real UI)</h3>
<p>
  Customer <select id="customer"></select>
  Life stage <select id="stage"><option value="">(not confirmed)</option></select>
  <button id="reset">Reset chat</button>
</p>
<div class="cols">
  <div>
    <b>Profile from the engine</b>
    <pre id="persona"></pre>
    <pre id="profile"></pre>
  </div>
  <div>
    <b>Chat</b>
    <div id="log"></div>
    <form id="form"><input id="text" placeholder="Can I afford a €600 laptop?" autocomplete="off"><button>Send</button></form>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let messages = [];

const get = url => fetch(url).then(r => r.json());
function add(cls, text) {
  const div = document.createElement('div');
  div.className = cls; div.textContent = text;
  $('log').append(div); $('log').scrollTop = $('log').scrollHeight;
}
async function loadProfile() {
  const stage = $('stage').value;
  const p = await get(`/profile/${$('customer').value}` + (stage ? `?life_stage=${stage}` : ''));
  $('persona').textContent = p.persona_text;
  delete p.persona_text;
  $('profile').textContent = JSON.stringify(p, null, 2);
}
function reset() { messages = []; $('log').textContent = ''; loadProfile(); }

$('form').onsubmit = async e => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text) return;
  $('text').value = '';
  messages.push({role: 'user', content: text});
  add('user', 'you: ' + text);
  const res = await fetch('/chat', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({customer_id: $('customer').value, messages, life_stage: $('stage').value || null})});
  if (!res.ok) { add('card', 'server error ' + res.status + ': ' + await res.text()); messages.pop(); return; }
  const out = await res.json();
  for (const c of out.cards) add('card', `[${c.tool} ${JSON.stringify(c.args)}] → ${JSON.stringify(c.result)}`);
  add('coach', 'coach: ' + out.reply);
  messages.push({role: 'assistant', content: out.reply});
  if ((out.life_stage || '') !== $('stage').value) { $('stage').value = out.life_stage || ''; loadProfile(); }
};
$('customer').onchange = () => { $('stage').value = ''; reset(); };
$('stage').onchange = loadProfile;
$('reset').onclick = reset;

(async () => {
  for (const c of await get('/customers')) $('customer').add(new Option(`${c.id} · ${c.label}`, c.id));
  for (const [k, v] of Object.entries(await get('/life-stages'))) $('stage').add(new Option(v.label, k));
  loadProfile();
})();
</script>
